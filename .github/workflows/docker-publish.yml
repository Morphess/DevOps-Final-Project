
name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - app.py
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-publish-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository  
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }}

      - name: Update deployment image in Git
        env:
          IMAGE_NAME: morphess/devops-backend
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/app/deployment.yaml")
          image = os.environ["IMAGE_NAME"]
          tag = os.environ["GITHUB_SHA"]

          content, count = re.subn(
              rf"(?m)^(\s*image:\s*){re.escape(image)}:[^\s]+",
              lambda match: f"{match.group(1)}{image}:{tag}",
              path.read_text(),
          )

          if count != 1:
              raise SystemExit("Expected exactly one backend image")

          path.write_text(content)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/app/deployment.yaml

          if git diff --cached --quiet; then
            echo "Deployment already uses this image"
            exit 0
          fi

          git commit -m "Deploy backend image ${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main
