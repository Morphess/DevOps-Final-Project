apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.morphess-devops.pp.ua
      secretName: devops-backend-tls
  rules:
    - host: app.morphess-devops.pp.ua
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-backend
                port:
                  number: 80
